/* ==========================================================================
   Catalyst A/C & Heat: component CSS (single source of truth)
   BUILD PHASE (on live, drafts): ships inside the "CX – Styles" saved
   template (HTML widget), inserted at the top of every new page, so nothing
   touches the live Site Settings. Rebuild that widget from this file with
   `python3 elementor/build.py`.
   LAUNCH: move this file into Site Settings → Custom CSS, set the matching
   Global Colors/Fonts, delete the CX – Styles widget from pages.
   Values are hard-coded on purpose: the live kit's globals are still the
   Elementor defaults (#6EC1E4 etc.).
   Apply classes via Advanced → CSS Classes on containers/widgets.
   ========================================================================== */

:root {
  --cx-blue:    #283A8A;
  --cx-navy:    #1B1B5C;
  --cx-text:    #2A2F45;
  --cx-red:     #B51C20;
  --cx-red-hover: #8F1519;
  --cx-navy-deep: #121240;
  --cx-ink:     #161A2E;
  --cx-muted:   #5A6075;
  --cx-border:  #D8DBE2;
  --cx-surface: #F3F5FA;
  --cx-silver:  #E7E9EE;
  --cx-success: #1E7A46;
  --cx-error:   #B3261E;

  --cx-font-head: "Barlow Condensed", "Arial Narrow", sans-serif;
  --cx-font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;

  --cx-radius: 8px;
  --cx-radius-btn: 6px;
  --cx-shadow: 0 1px 2px rgba(22, 26, 46, .06);
  --cx-shadow-hover: 0 8px 24px rgba(22, 26, 46, .10);
  --cx-max: 1240px;
  --cx-measure: 720px;
  --cx-gutter: 24px;
  --cx-section-y: 96px;
  --cx-section-y-tight: 64px;
  --cx-gap: 24px;
}
@media (max-width: 1024px) { :root { --cx-section-y: 72px; --cx-section-y-tight: 48px; } }
@media (max-width: 767px)  { :root { --cx-section-y: 56px; --cx-section-y-tight: 40px; --cx-gutter: 20px; } }

/* ---------- Base: overrides the live kit's default widget styles ----------
   Same specificity as Elementor's kit defaults (:where adds none) and loaded
   later (in-body <style>), so these beat the live kit's #6EC1E4/#7A7A7A/
   #61CE70 defaults while every cx- component rule below still beats them.
   At launch these become Site Settings → Typography and can be deleted. */
body.elementor-page, .elementor { font-family: var(--cx-font-body); color: var(--cx-text); }
:where(.elementor) .elementor-widget-text-editor,
:where(.elementor) .elementor-widget-text-editor p { font-family: var(--cx-font-body); font-size: 18px; line-height: 1.6; color: var(--cx-text); }
:where(.elementor) .elementor-widget-heading .elementor-heading-title { font-family: var(--cx-font-head); font-weight: 700; color: var(--cx-ink); margin: 0 0 16px; }
:where(.elementor) .elementor-widget-heading h1.elementor-heading-title { font-size: 60px; line-height: 1.05; }
:where(.elementor) .elementor-widget-heading h2.elementor-heading-title { font-size: 44px; line-height: 1.1; }
:where(.elementor) .elementor-widget-heading h3.elementor-heading-title { font-size: 26px; line-height: 1.2; font-weight: 600; }
:where(.elementor) .elementor-widget-heading h4.elementor-heading-title { font-family: var(--cx-font-body); font-size: 20px; line-height: 1.3; font-weight: 600; }
:where(.elementor) .elementor-widget-button .elementor-button { font-family: var(--cx-font-body); font-weight: 600; font-size: 17px; background: var(--cx-red); color: #fff; border-radius: var(--cx-radius-btn); min-height: 48px; padding: 14px 28px; }
:where(.elementor) .elementor-widget-button .elementor-button:hover { background: var(--cx-red-hover); }
:where(.elementor) a { color: var(--cx-blue); }
@media (max-width: 1024px) {
  :where(.elementor) .elementor-widget-text-editor, :where(.elementor) .elementor-widget-text-editor p { font-size: 17px; }
  :where(.elementor) .elementor-widget-heading h1.elementor-heading-title { font-size: 48px; }
  :where(.elementor) .elementor-widget-heading h2.elementor-heading-title { font-size: 38px; }
  :where(.elementor) .elementor-widget-heading h3.elementor-heading-title { font-size: 24px; }
}
@media (max-width: 767px) {
  :where(.elementor) .elementor-widget-text-editor, :where(.elementor) .elementor-widget-text-editor p { font-size: 16px; }
  :where(.elementor) .elementor-widget-heading h1.elementor-heading-title { font-size: 38px; }
  :where(.elementor) .elementor-widget-heading h2.elementor-heading-title { font-size: 32px; }
  :where(.elementor) .elementor-widget-heading h3.elementor-heading-title { font-size: 22px; }
}

/* ---------- Sections ---------- */
.cx-section        { padding-block: var(--cx-section-y); padding-inline: var(--cx-gutter); }
.cx-section--tight { padding-block: var(--cx-section-y-tight); }
.cx-surface        { background: var(--cx-surface); }
.cx-dark           { background: var(--cx-navy); color: #fff; }
.cx-dark h1, .cx-dark h2, .cx-dark h3,
.cx-dark .elementor-heading-title { color: #fff; }
.cx-dark p, .cx-dark li { color: #DCDFF0; }
.cx-measure        { max-width: var(--cx-measure); }
.cx-center         { text-align: center; margin-inline: auto; }

/* Section intro: eyebrow + H2 + lead paragraph */
.cx-eyebrow, .cx-eyebrow .elementor-heading-title {
  font-family: var(--cx-font-body);
  font-size: 14px; font-weight: 600; line-height: 1.2;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--cx-blue); margin: 0 0 12px;
}
.cx-dark .cx-eyebrow, .cx-dark .cx-eyebrow .elementor-heading-title { color: #FF8A8C; }
.cx-lead { font-size: 1.125em; color: var(--cx-muted); max-width: var(--cx-measure); }
.cx-dark .cx-lead { color: #C9CDE8; }

/* ---------- Buttons ----------
   Native Button widget: style "primary" in Site Settings → Buttons;
   add cx-btn--outline / cx-btn--light to the widget for variants. */
.cx-btn .elementor-button, a.cx-btn, button.cx-btn {
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 14px 28px;
  font-family: var(--cx-font-body); font-weight: 600; font-size: 17px; line-height: 1.25; text-align: center;
  background: var(--cx-red); color: #fff; border: 2px solid var(--cx-red);
  border-radius: var(--cx-radius-btn); text-decoration: none;
  transition: background-color .15s ease, border-color .15s ease, color .15s ease;
}
.cx-btn .elementor-button:hover, a.cx-btn:hover, button.cx-btn:hover { background: var(--cx-red-hover); border-color: var(--cx-red-hover); color: #fff; }
.cx-btn--outline .elementor-button, a.cx-btn--outline { background: transparent; color: var(--cx-navy); border-color: var(--cx-navy); }
.cx-btn--outline .elementor-button:hover, a.cx-btn--outline:hover { background: var(--cx-navy); color: #fff; border-color: var(--cx-navy); }
.cx-dark .cx-btn--outline .elementor-button, .cx-dark a.cx-btn--outline,
.cx-band-commercial .cx-btn--outline .elementor-button, .cx-band-commercial a.cx-btn--outline { color: #fff; border-color: #fff; }
.cx-dark .cx-btn--outline .elementor-button:hover, .cx-dark a.cx-btn--outline:hover,
.cx-band-commercial .cx-btn--outline .elementor-button:hover, .cx-band-commercial a.cx-btn--outline:hover { background: #fff; color: var(--cx-navy); }
/* Light variant: white button with red text, for coloured bands */
.cx-btn--light .elementor-button, a.cx-btn--light { background: #fff; color: var(--cx-red); border-color: #fff; }
.cx-btn--light .elementor-button:hover, a.cx-btn--light:hover { background: var(--cx-surface); color: var(--cx-red-hover); border-color: var(--cx-surface); }

.cx-cta-pair { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
@media (max-width: 480px) { .cx-cta-pair > * { flex: 1 1 100%; } .cx-cta-pair a.cx-btn, .cx-cta-pair .elementor-button { width: 100%; } }

.cx-link-arrow, .cx-link-arrow a {
  font-weight: 600; color: var(--cx-blue); text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px;
}
.cx-link-arrow::after, .cx-link-arrow a::after { content: "→"; transition: transform .15s ease; }
.cx-link-arrow:hover::after, .cx-link-arrow a:hover::after { transform: translateX(4px); }
.cx-dark .cx-link-arrow, .cx-dark .cx-link-arrow a { color: #fff; }

/* Focus: visible on light and dark */
:where(a, button, summary, input, select, textarea, [tabindex]):focus-visible {
  outline: 3px solid var(--cx-blue); outline-offset: 2px; border-radius: 4px;
}
.cx-dark :where(a, button, summary, input, select, textarea):focus-visible,
.cx-request :where(a, button):focus-visible, .cx-hero :where(a, button):focus-visible,
.cx-band-commercial :where(a, button):focus-visible { outline-color: #7FA2FF; }

/* ---------- Grids & cards ---------- */
.cx-grid-3 { display: grid; gap: var(--cx-gap); grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cx-grid-2 { display: grid; gap: 48px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
@media (max-width: 1024px) { .cx-grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 767px)  { .cx-grid-3, .cx-grid-2 { grid-template-columns: 1fr; gap: 16px; } .cx-grid-2 { gap: 32px; } }

.cx-card {
  position: relative; background: #fff; border: 1px solid var(--cx-border);
  border-radius: var(--cx-radius); box-shadow: var(--cx-shadow); padding: 28px;
  display: flex; flex-direction: column; gap: 10px;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.cx-card h3, .cx-card .elementor-heading-title { margin: 0; }
.cx-card p { margin: 0; color: var(--cx-muted); }
.cx-card .cx-link-arrow { margin-top: auto; padding-top: 8px; }
/* Whole-card click target: put the link on the card's link widget and
   it stretches over the card (keeps one accessible link per card). */
.cx-card--link .cx-link-arrow a::before, .cx-card--link a.cx-link-arrow::before { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.cx-card--link:hover { transform: translateY(-2px); box-shadow: var(--cx-shadow-hover); border-color: var(--cx-blue); }
.cx-card--feature { border-top: 4px solid var(--cx-red); }

/* ---------- Brand motif: the logo's chamfered badge ----------
   .cx-chamfer cuts the corners like the logo hexagon; use on hero/project
   images and icon tiles. --cx-cut sets the corner size. */
.cx-chamfer { --cx-cut: 22px; clip-path: polygon(var(--cx-cut) 0, calc(100% - var(--cx-cut)) 0, 100% var(--cx-cut), 100% calc(100% - var(--cx-cut)), calc(100% - var(--cx-cut)) 100%, var(--cx-cut) 100%, 0 calc(100% - var(--cx-cut)), 0 var(--cx-cut)); }

/* Eyebrow gets the logo's red band as a short rule */
p.cx-eyebrow::before, .cx-eyebrow .elementor-heading-title::before {
  content: ""; display: inline-block; width: 28px; height: 3px; margin-right: 12px;
  vertical-align: middle; transform: translateY(-2px); background: var(--cx-red);
}
.cx-center p.cx-eyebrow::before, .cx-band-cta p.cx-eyebrow::before { display: none; }

/* ---------- Hero (dark; add cx-dark too so text/buttons invert) ---------- */
.cx-hero {
  position: relative; overflow: hidden; isolation: isolate;
  background: var(--cx-navy); color: #fff;
  padding-block: 88px 0; padding-inline: var(--cx-gutter);
}
/* Large faint badge outline, echoing the logo, bleeding off the right edge */
.cx-hero::before {
  content: ""; position: absolute; z-index: -1; right: -180px; top: -120px; width: 720px; height: 720px;
  background: linear-gradient(135deg, rgba(40,58,138,.55), rgba(40,58,138,0) 70%);
  clip-path: polygon(25% 0, 75% 0, 100% 25%, 100% 75%, 75% 100%, 25% 100%, 0 75%, 0 25%);
}
.cx-hero__grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 64px; align-items: center; padding-bottom: 72px; }
.cx-hero h1, .cx-hero .elementor-heading-title { color: #fff; margin: 0 0 22px; }
.cx-hero p:not(.cx-eyebrow) { font-size: 1.15em; color: #DCDFF0; max-width: 580px; margin: 0 0 32px; }
.cx-hero__media { aspect-ratio: 4 / 3; overflow: hidden; background: #2A2A70; }
.cx-hero__media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cx-hero__secondary { margin-top: 20px; }

/* Quick router along the bottom of the hero: "what's going on?" */
.cx-routes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid rgba(255,255,255,.14); }
.cx-route { position: relative; display: block; padding: 26px 28px 28px 0; text-decoration: none; color: #fff; }
.cx-route + .cx-route { padding-left: 28px; border-left: 1px solid rgba(255,255,255,.14); }
.cx-route__q { display: block; font-size: 15px; color: #AEB4DA; margin-bottom: 6px; }
.cx-route__a { display: inline-flex; align-items: center; gap: 8px; font-family: var(--cx-font-head); font-weight: 700; font-size: 24px; line-height: 1.15; color: #fff; }
.cx-route__a::after { content: "→"; font-family: var(--cx-font-body); font-weight: 400; color: #FF8A8C; transition: transform .15s ease; }
.cx-route:hover .cx-route__a::after { transform: translateX(5px); }
.cx-route::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 3px; background: var(--cx-red); transform: scaleX(0); transform-origin: left; transition: transform .2s ease; }
.cx-route + .cx-route::before { left: 0; }
.cx-route:hover::before { transform: scaleX(1); }

@media (max-width: 1024px) {
  .cx-hero__grid { grid-template-columns: 1fr; gap: 36px; padding-bottom: 48px; }
  .cx-hero__media { aspect-ratio: 16 / 9; }
}
@media (max-width: 767px) {
  .cx-hero { padding-block: 44px 0; }
  .cx-hero::before { width: 420px; height: 420px; right: -220px; top: -60px; }
  .cx-routes { grid-template-columns: 1fr; }
  .cx-route, .cx-route + .cx-route { padding: 18px 0; border-left: 0; border-top: 1px solid rgba(255,255,255,.14); }
  .cx-route:first-child { border-top: 0; }
  .cx-route__a { font-size: 21px; }
}

/* ---------- Icon tile (logo-derived SVG icons in elementor/icons/) ---------- */
.cx-icon {
  --cx-cut: 10px; width: 56px; height: 56px; flex: none;
  display: grid; place-items: center; background: var(--cx-surface); color: var(--cx-blue);
  clip-path: polygon(var(--cx-cut) 0, calc(100% - var(--cx-cut)) 0, 100% var(--cx-cut), 100% calc(100% - var(--cx-cut)), calc(100% - var(--cx-cut)) 100%, var(--cx-cut) 100%, 0 calc(100% - var(--cx-cut)), 0 var(--cx-cut));
  transition: background-color .15s ease, color .15s ease;
}
.cx-icon svg { width: 30px; height: 30px; }
.cx-card--link:hover .cx-icon { background: var(--cx-navy); color: #fff; }
.cx-card--feature .cx-icon { background: #FBEAEA; color: var(--cx-red); }
.cx-card--link.cx-card--feature:hover .cx-icon { background: var(--cx-red); color: #fff; }

/* ---------- Trust strip (hidden until facts are verified) ---------- */
.cx-trust { display: flex; flex-wrap: wrap; gap: 12px 32px; padding-block: 20px; border-block: 1px solid var(--cx-border); font-weight: 600; color: var(--cx-navy); }
.cx-trust:empty { display: none; }

/* ---------- Commercial band: own treatment, same brand ---------- */
.cx-band-commercial {
  background: var(--cx-navy-deep); color: #fff; position: relative;
  padding-block: var(--cx-section-y); padding-inline: var(--cx-gutter);
  background-image: linear-gradient(115deg, var(--cx-navy-deep) 0%, var(--cx-navy-deep) 58%, var(--cx-navy) 58%, var(--cx-navy) 100%);
}
.cx-band-commercial::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--cx-red); }
.cx-band-commercial h2, .cx-band-commercial .elementor-heading-title { color: #fff; }
.cx-band-commercial p { color: #C9CDE8; }
.cx-band-commercial .cx-eyebrow, .cx-band-commercial .cx-eyebrow .elementor-heading-title { color: #FF8A8C; }
@media (max-width: 767px) { .cx-band-commercial { background-image: none; } }

/* ---------- Decision module (repair vs replace) ---------- */
.cx-decision { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--cx-gap); }
.cx-decision__opt { border: 1px solid var(--cx-border); border-radius: var(--cx-radius); padding: 28px; background: #fff; }
.cx-decision__opt--repair  { border-left: 4px solid var(--cx-blue); }
.cx-decision__opt--replace { border-left: 4px solid var(--cx-navy); }
.cx-decision__opt h3 { margin-top: 0; }
@media (max-width: 767px) { .cx-decision { grid-template-columns: 1fr; } }

/* ---------- Process steps ---------- */
.cx-steps { counter-reset: cx-step; display: grid; gap: var(--cx-gap); grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); list-style: none; padding: 0; margin: 0; }
.cx-steps > * { counter-increment: cx-step; position: relative; padding-top: 52px; }
.cx-steps > *::before {
  content: counter(cx-step); position: absolute; top: 0; left: 0;
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: var(--cx-navy); color: #fff; font-family: var(--cx-font-head); font-weight: 700; font-size: 20px;
}

/* ---------- Service-area bridge ---------- */
.cx-areas { display: flex; flex-wrap: wrap; gap: 10px; margin: 24px 0; padding: 0; list-style: none; }
.cx-chip, .cx-chip a {
  display: inline-flex; align-items: center; min-height: 44px; padding: 10px 18px;
  border: 1px solid var(--cx-border); border-radius: 999px; background: #fff;
  color: var(--cx-navy); font-weight: 600; text-decoration: none;
  transition: border-color .15s ease, background-color .15s ease;
}
.cx-chip:hover, .cx-chip a:hover { border-color: var(--cx-blue); background: var(--cx-surface); }

/* ---------- Proof module: container hides itself when empty ---------- */
.cx-proof:not(:has(img, .cx-review, .cx-card)) { display: none; }

/* ---------- FAQ (Elementor Accordion widget + cx-faq, or <details>) ---------- */
.cx-faq { max-width: 880px; }
.cx-faq details, .cx-faq .elementor-accordion-item { border-bottom: 1px solid var(--cx-border); }
.cx-faq summary, .cx-faq .elementor-tab-title {
  list-style: none; cursor: pointer; padding: 22px 40px 22px 0; position: relative;
  font-family: var(--cx-font-body); font-weight: 600; font-size: 1.1em; color: var(--cx-ink);
}
.cx-faq summary::-webkit-details-marker { display: none; }
.cx-faq summary::after { content: "+"; position: absolute; right: 4px; top: 50%; transform: translateY(-50%); font-size: 26px; font-weight: 400; color: var(--cx-blue); }
.cx-faq details[open] summary::after { content: "–"; }
.cx-faq details > div, .cx-faq .elementor-tab-content { padding: 0 0 22px; color: var(--cx-text); max-width: var(--cx-measure); }

/* ---------- Final CTA band ---------- */
.cx-band-cta { background: var(--cx-blue); color: #fff; padding-block: var(--cx-section-y-tight); padding-inline: var(--cx-gutter); text-align: center; }
.cx-band-cta h2, .cx-band-cta .elementor-heading-title { color: #fff; }
.cx-band-cta p { color: #E3E7F7; max-width: 640px; margin-inline: auto; }
.cx-band-cta .cx-cta-pair { justify-content: center; }
.cx-band-cta .cx-btn--outline .elementor-button, .cx-band-cta a.cx-btn--outline { color: #fff; border-color: #fff; }
.cx-band-cta .cx-btn--outline .elementor-button:hover, .cx-band-cta a.cx-btn--outline:hover { background: #fff; color: var(--cx-blue); }
.cx-band-cta .cx-link-arrow, .cx-band-cta .cx-link-arrow a { color: #fff; }
.cx-band-cta :where(a, button):focus-visible { outline-color: #fff; }

/* ---------- Mobile call / request bar (Theme Builder footer) ---------- */
.cx-mobilebar { display: none; }
@media (max-width: 767px) {
  .cx-mobilebar {
    display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 8px;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 999;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    background: #fff; border-top: 1px solid var(--cx-border); box-shadow: 0 -4px 16px rgba(22,26,46,.08);
  }
  .cx-mobilebar a.cx-btn { min-height: 48px; padding: 12px 10px; font-size: 15px; white-space: nowrap; }
  body { padding-bottom: 72px; } /* the bar never covers the footer or forms */
}

/* ---------- Staging-only placeholder: remove every instance before launch ---------- */
.cx-ph {
  border: 2px dashed #C98A00; background: #FFF8E6; color: #6B4A00;
  border-radius: var(--cx-radius); padding: 14px 16px; font-size: 14px; font-weight: 600;
}
.cx-ph::before { content: "STAGING PLACEHOLDER · "; letter-spacing: .06em; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}

/* ==========================================================================
   HEADER: saved template "CX – Header" (HTML widget) at the top of each
   Canvas page. Theme Builder takes over at launch.
   ========================================================================== */
.cx-header { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,.97); backdrop-filter: saturate(1.4) blur(8px); border-bottom: 1px solid var(--cx-border); }
.cx-header__bar { display: flex; align-items: center; gap: 28px; min-height: 84px; max-width: var(--cx-max); margin-inline: auto; padding-inline: var(--cx-gutter); }
.cx-header__logo img { height: 60px; width: auto; display: block; }
.cx-nav { display: flex; gap: 2px; margin: 0 0 0 auto; padding: 0; list-style: none; }
.cx-nav > li { position: relative; }
.cx-nav > li > a, .cx-nav > li > button {
  display: flex; align-items: center; gap: 7px; min-height: 48px; padding: 0 14px;
  font: 600 16px/1 var(--cx-font-body); color: var(--cx-navy); text-decoration: none;
  background: none; border: 0; cursor: pointer; border-radius: 6px;
}
